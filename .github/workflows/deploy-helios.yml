name: Deploy docs to Helios
on:
  push:
    branches: ['**', '!gh-pages']
  workflow_dispatch:
    inputs:
      mode:
        description: Publish or restore the previous version of this branch
        type: choice
        options: [publish, rollback]
        default: publish

permissions:
  contents: read

concurrency:
  group: helios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_type == 'branch' && github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
        if: inputs.mode != 'rollback'

      - name: Configure SSH and publication path
        shell: bash
        env:
          LOGIN: ${{ secrets.HELIOS_USER }}
          KEY: ${{ secrets.HELIOS_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.HELIOS_SSH_KNOWN_HOSTS }}
          PROJECT: ${{ vars.HELIOS_SITE_SUBDIR || 'automl-eda-module' }}
        run: |
          set -euo pipefail
          [[ "$LOGIN" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          [[ "$PROJECT" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEYS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -F '[helios.cs.ifmo.ru]:2222' -f ~/.ssh/known_hosts | ssh-keygen -lf - >/dev/null
          cat > ~/.ssh/config <<EOF
          Host helios
            HostName helios.cs.ifmo.ru
            Port 2222
            User $LOGIN
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          path="$PROJECT"
          if [[ "$GITHUB_REF_NAME" != main ]]; then
            branch_id=$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-20)
            path="$PROJECT-preview/$branch_id"
          fi
          echo "SITE_PATH=$path" >> "$GITHUB_ENV"
          echo "SITE_URL=https://se.ifmo.ru/~$LOGIN/$path/" >> "$GITHUB_ENV"

      - name: Publish and verify
        env:
          MODE: ${{ inputs.mode || 'publish' }}
        run: bash .github/scripts/helios-deploy.sh
